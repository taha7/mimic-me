<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mimic Me</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #666;
      --accent: #7c6af7;
      --accent-dim: #3d3568;
      --green: #3ecf8e;
      --red: #ff5c5c;
      --radius: 8px;
      --font: 'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    header span { color: var(--muted); font-size: 12px; }

    main { max-width: 860px; margin: 0 auto; padding: 40px 32px; }

    section { margin-bottom: 48px; }
    section h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }

    /* Login */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 360px;
    }
    .login-box h2 { font-size: 18px; margin-bottom: 8px; }
    .login-box p { color: var(--muted); margin-bottom: 24px; }

    input[type="text"], input[type="password"], textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    input.row { margin-bottom: 12px; }

    button {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button.secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.danger { background: var(--red); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Agent card */
    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .agent-info h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .agent-info .status {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.on { background: var(--green); }
    .dot.off { background: var(--red); }

    .agent-actions { display: flex; gap: 8px; }

    /* Toggle switch */
    .toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      gap: 8px;
    }
    .toggle input { display: none; }
    .toggle-track {
      width: 40px; height: 22px;
      background: var(--border);
      border-radius: 11px;
      position: relative;
      transition: background 0.2s;
    }
    .toggle input:checked + .toggle-track { background: var(--accent); }
    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: left 0.2s;
    }
    .toggle input:checked ~ .toggle-track .toggle-thumb { left: 21px; }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 680px;
      max-width: 95vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 15px; font-weight: 600; }
    .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    textarea.editor {
      width: 100%;
      height: 380px;
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
    }

    /* Patterns list */
    .pattern-list { list-style: none; }
    .pattern-list li {
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
    .pattern-list li::before {
      content: '→ ';
      color: var(--accent);
      font-weight: 600;
    }
    .empty { color: var(--muted); font-size: 13px; }

    /* Settings */
    .settings-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
    .settings-row label { color: var(--muted); font-size: 12px; width: 100px; flex-shrink: 0; }
    .settings-row input { flex: 1; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 200;
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: var(--red); color: var(--red); }
    #toast.success { border-color: var(--green); color: var(--green); }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <h2>Mimic Me</h2>
    <p>Enter your API credentials to continue.</p>
    <input class="row" id="api-url" type="text" placeholder="API URL (e.g. https://api.example.com)" />
    <input class="row" id="api-secret" type="password" placeholder="API secret" />
    <button onclick="login()" style="width:100%">Sign in</button>
  </div>
</div>

<!-- App -->
<div id="app" style="display:none">
  <header>
    <h1>Mimic Me</h1>
    <span id="header-url"></span>
  </header>
  <main>
    <section>
      <h2>Agents</h2>
      <div id="agents-list"></div>
    </section>
  </main>
</div>

<!-- Workflow modal -->
<div class="modal-backdrop" id="workflow-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="workflow-modal-title">Edit workflow</h3>
      <button class="secondary" onclick="closeModal('workflow-modal')">✕</button>
    </div>
    <div class="modal-body">
      <textarea class="editor" id="workflow-editor"></textarea>
    </div>
    <div class="modal-footer">
      <button class="secondary" onclick="closeModal('workflow-modal')">Cancel</button>
      <button id="workflow-save-btn" onclick="saveWorkflow()">Save</button>
    </div>
  </div>
</div>

<!-- Patterns modal -->
<div class="modal-backdrop" id="patterns-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="patterns-modal-title">Learned patterns</h3>
      <button class="secondary" onclick="closeModal('patterns-modal')">✕</button>
    </div>
    <div class="modal-body">
      <ul class="pattern-list" id="patterns-list"></ul>
    </div>
    <div class="modal-footer">
      <button class="secondary" onclick="closeModal('patterns-modal')">Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let API_URL = '';
  let API_SECRET = '';
  let activeWorkflowAgent = '';

  function login() {
    API_URL = document.getElementById('api-url').value.trim().replace(/\/$/, '');
    API_SECRET = document.getElementById('api-secret').value.trim();
    if (!API_URL || !API_SECRET) return showToast('Fill in both fields.', 'error');
    sessionStorage.setItem('mimic_api_url', API_URL);
    sessionStorage.setItem('mimic_api_secret', API_SECRET);
    loadApp();
  }

  async function api(method, path, body) {
    const res = await fetch(`${API_URL}${path}`, {
      method,
      headers: {
        'Authorization': `Bearer ${API_SECRET}`,
        'Content-Type': 'application/json',
      },
      ...(body !== undefined ? { body: JSON.stringify(body) } : {}),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error ?? res.statusText);
    }
    return res.json();
  }

  async function loadApp() {
    try {
      const agents = await api('GET', '/agents');
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('header-url').textContent = API_URL;
      renderAgents(agents);
    } catch (err) {
      showToast(`Login failed: ${err.message}`, 'error');
    }
  }

  function renderAgents(agents) {
    const el = document.getElementById('agents-list');
    el.innerHTML = '';
    for (const [name, info] of Object.entries(agents)) {
      const card = document.createElement('div');
      card.className = 'agent-card';
      card.id = `agent-${name}`;
      card.innerHTML = `
        <div class="agent-info">
          <h3>${name}</h3>
          <div class="status">
            <span class="dot ${info.enabled ? 'on' : 'off'}"></span>
            <span>${info.enabled ? 'Enabled' : 'Disabled'}</span>
          </div>
        </div>
        <div class="agent-actions">
          <button class="secondary" onclick="openPatterns('${name}')">Patterns</button>
          <button class="secondary" onclick="openWorkflow('${name}')">Edit workflow</button>
          <button class="${info.enabled ? 'danger' : ''} secondary" id="toggle-${name}"
            onclick="toggleAgent('${name}', ${!info.enabled})">
            ${info.enabled ? 'Disable' : 'Enable'}
          </button>
        </div>`;
      el.appendChild(card);
    }
    if (!Object.keys(agents).length) {
      el.innerHTML = '<p class="empty">No agents found in config.yaml.</p>';
    }
  }

  async function toggleAgent(name, enable) {
    const btn = document.getElementById(`toggle-${name}`);
    btn.disabled = true;
    try {
      await api('PATCH', `/agents/${name}/enabled`, { enabled: enable });
      showToast(`${name} ${enable ? 'enabled' : 'disabled'}.`, 'success');
      const agents = await api('GET', '/agents');
      renderAgents(agents);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
    }
  }

  async function openWorkflow(name) {
    activeWorkflowAgent = name;
    document.getElementById('workflow-modal-title').textContent = `Edit workflow — ${name}`;
    const editor = document.getElementById('workflow-editor');
    editor.value = 'Loading…';
    openModal('workflow-modal');
    try {
      const { content } = await api('GET', `/agents/${name}/workflow`);
      editor.value = content;
    } catch (err) {
      editor.value = '';
      showToast(err.message, 'error');
    }
  }

  async function saveWorkflow() {
    const btn = document.getElementById('workflow-save-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const content = document.getElementById('workflow-editor').value;
      await api('PUT', `/agents/${activeWorkflowAgent}/workflow`, { content });
      showToast('workflow.md saved.', 'success');
      closeModal('workflow-modal');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save';
    }
  }

  async function openPatterns(name) {
    document.getElementById('patterns-modal-title').textContent = `Learned patterns — ${name}`;
    const list = document.getElementById('patterns-list');
    list.innerHTML = '<li style="color:var(--muted)">Loading…</li>';
    openModal('patterns-modal');
    try {
      const { patterns } = await api('GET', `/agents/${name}/patterns`);
      if (!patterns.length) {
        list.innerHTML = '<p class="empty">No patterns yet. Merge a PR with review comments to start learning.</p>';
      } else {
        list.innerHTML = patterns.map((p) => `<li>${p}</li>`).join('');
      }
    } catch (err) {
      list.innerHTML = '';
      showToast(err.message, 'error');
    }
  }

  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  let toastTimer;
  function showToast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 3000);
  }

  // Restore session on load
  window.addEventListener('DOMContentLoaded', () => {
    const url = sessionStorage.getItem('mimic_api_url');
    const secret = sessionStorage.getItem('mimic_api_secret');
    if (url && secret) {
      document.getElementById('api-url').value = url;
      document.getElementById('api-secret').value = secret;
      API_URL = url;
      API_SECRET = secret;
      loadApp();
    }
  });

  // Close modal on backdrop click
  document.querySelectorAll('.modal-backdrop').forEach(el => {
    el.addEventListener('click', (e) => { if (e.target === el) el.classList.remove('open'); });
  });
</script>
</body>
</html>
